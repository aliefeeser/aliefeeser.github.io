<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabMaster - English Word Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <meta name="description" content="A simple and elegant English vocabulary game based on study notes.">
</head>
<body>
    <div id="app" class="app-container">
        <!-- Main Screen -->
        <header>
            <h1>VocabMaster</h1>
            <p>Master your units with ease</p>
        </header>

        <main id="main-content">
            <!-- Screen: Unit Selection -->
            <section id="selection-screen" class="screen active">
                <h2>Select a Unit</h2>
                <div class="unit-grid" id="unit-grid">
                    <!-- Units will be injected here -->
                </div>
            </section>

            <!-- Screen: Flashcards -->
            <section id="flashcard-screen" class="screen">
                <button class="back-btn" onclick="showScreen('selection-screen')">← Back</button>
                <div class="card-container">
                    <div class="flashcard" id="flashcard" onclick="this.classList.toggle('flipped')">
                        <div class="card-face front">
                            <span class="word" id="flash-front">Word</span>
                        </div>
                        <div class="card-face back">
                            <span class="meaning" id="flash-back">Meaning</span>
                        </div>
                    </div>
                </div>
                <div class="controls">
                    <button class="btn sekundary" onclick="prevCard()">Previous</button>
                    <span id="card-progress">1 / X</span>
                    <button class="btn secondary" onclick="nextCard()">Next</button>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 VocabMaster | Simple & Smart</p>
        </footer>
    </div>

    <!-- Background Decoration -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <script src="script.js?v=2"></script>
</body>
</html>
