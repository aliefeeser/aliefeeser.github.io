<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabMaster - English Word Game</title>
    <link rel="stylesheet" href="style.css?v=5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <meta name="description" content="A simple and elegant English vocabulary game based on study notes.">
</head>
<body>
    <div id="app" class="app-container">
        <!-- Main Screen -->
        <header>
            <h1>VocabMaster</h1>
            <p>Master your units with ease</p>
        </header>

        <main id="main-content">
            <!-- Screen: Unit Selection -->
            <section id="selection-screen" class="screen active">
                <h2>Select a Unit</h2>
                <div class="unit-grid" id="unit-grid">
                    <!-- Units will be injected here -->
                </div>
                <div class="mix-btn-wrapper">
                    <button class="mix-btn" onclick="showMixScreen()">
                        <span class="mix-icon">🔀</span> Mix Mode
                    </button>
                </div>
            </section>

            <!-- Screen: Mix Config -->
            <section id="mix-screen" class="screen">
                <button class="back-btn" onclick="showScreen('selection-screen')">← Back</button>
                <h2>Mix Mode</h2>
                <p class="mix-subtitle">Select units to mix</p>
                <div class="mix-unit-grid" id="mix-unit-grid">
                    <!-- Checkboxes injected here -->
                </div>
                <div class="settings-group">
                    <label>How many words?</label>
                    <div class="chip-group" id="mix-count-selector">
                        <button class="chip" onclick="setMixCount(10)">10</button>
                        <button class="chip" onclick="setMixCount(20)">20</button>
                        <button class="chip active" onclick="setMixCount(30)">30</button>
                        <button class="chip" onclick="setMixCount(50)">50</button>
                        <button class="chip" onclick="setMixCount('all')">All</button>
                    </div>
                </div>
                <button class="btn primary start-mix-btn" id="start-mix-btn" onclick="startMix()">Start</button>
            </section>

            <!-- Screen: Flashcards -->
            <section id="flashcard-screen" class="screen">
                <button class="back-btn" id="flashcard-back-btn" onclick="goBackFromFlashcard()">← Back</button>
                <div class="card-container">
                    <div class="flashcard" id="flashcard" onclick="this.classList.toggle('flipped')">
                        <div class="card-face front">
                            <span class="word" id="flash-front">Word</span>
                        </div>
                        <div class="card-face back">
                            <span class="meaning" id="flash-back">Meaning</span>
                        </div>
                    </div>
                </div>
                <div class="controls">
                    <button class="btn sekundary" onclick="prevCard()">Previous</button>
                    <span id="card-progress">1 / X</span>
                    <button class="btn secondary" onclick="nextCard()">Next</button>
                </div>
            </section>
        </main>

        <footer>
            <button class="theme-toggle" id="theme-toggle" onclick="toggleDarkMode()">
                <span id="theme-icon">🌙</span> Dark Mode
            </button>
            <p>&copy; 2026 VocabMaster | Simple &amp; Smart</p>
        </footer>
    </div>

    <!-- Background Decoration -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <script src="script.js?v=5"></script>
</body>
</html>
